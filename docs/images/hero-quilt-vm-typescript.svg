        <text x="59" y="199">BIND</text>
        <rect x="78" y="188" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="89" y="199">LINK</text>
        <rect x="48" y="210" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="59" y="221">BIND</text>
        <rect x="78" y="210" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="89" y="221">LINK</text>
        <rect x="48" y="232" width="22" height="14" rx="2" opacity="0.9"/>
