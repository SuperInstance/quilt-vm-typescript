        <rect x="288" y="136" width="64" height="14" rx="2" opacity="0.9"/>
        <text x="320" y="147">EFFECT</text>
        <rect x="288" y="158" width="64" height="14" rx="2" opacity="0.9"/>
        <text x="320" y="169">EFFECT</text>
        <rect x="288" y="180" width="64" height="14" rx="2" opacity="0.9"/>
