        <rect x="558" y="142" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="569" y="153">TICK</text>
        <rect x="528" y="164" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="539" y="175">VIEW</text>
        <rect x="558" y="164" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="569" y="175">TICK</text>
        <rect x="528" y="186" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="539" y="197">VIEW</text>
        <rect x="558" y="186" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="569" y="197">TICK</text>
        <rect x="528" y="208" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="539" y="219">VIEW</text>
        <rect x="558" y="208" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="569" y="219">TICK</text>
        <rect x="528" y="230" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="539" y="241">VIEW</text>
        <rect x="558" y="230" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="569" y="241">TICK</text>
        <rect x="528" y="252" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="539" y="263">VIEW</text>
        <rect x="558" y="252" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="569" y="263">TICK</text>
      </g>
    </g>
  </g>
  <!-- streetlights with neon signs that name the 5 opcodes -->
  <g font-family="ui-sans-serif,system-ui" font-size="8" font-weight="600" text-anchor="middle">
    <line x1="180" y1="280" x2="180" y2="300" stroke="#FBBF24" stroke-width="1"/>
    <circle cx="180" cy="278" r="3" fill="#FBBF24" filter="url(#neon)"/>
    <line x1="220" y1="280" x2="220" y2="300" stroke="#FBBF24" stroke-width="1"/>
    <circle cx="220" cy="278" r="3" fill="#FBBF24" filter="url(#neon)"/>
    <line x1="420" y1="280" x2="420" y2="300" stroke="#FBBF24" stroke-width="1"/>
    <circle cx="420" cy="278" r="3" fill="#FBBF24" filter="url(#neon)"/>
    <line x1="460" y1="280" x2="460" y2="300" stroke="#FBBF24" stroke-width="1"/>
    <circle cx="460" cy="278" r="3" fill="#FBBF24" filter="url(#neon)"/>
  </g>
  <!-- ground -->
  <rect y="300" width="640" height="20" fill="url(#streets)"/>
  <line x1="0" y1="305" x2="640" y2="305" stroke="#FBBF24" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.5"/>
  <!-- title -->
  <text x="320" y="20" text-anchor="middle" fill="#E0E7FF" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="600" letter-spacing="0.08em">EVERY WINDOW · FIVE Opcodes · THE CITY</text>
</svg>
