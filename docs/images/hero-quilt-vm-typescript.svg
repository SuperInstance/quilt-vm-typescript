        <text x="89" y="155">LINK</text>
        <rect x="48" y="166" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="59" y="177">BIND</text>
        <rect x="78" y="166" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="89" y="177">LINK</text>
