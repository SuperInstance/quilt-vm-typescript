        <text x="59" y="265">BIND</text>
        <rect x="78" y="254" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="89" y="265">LINK</text>
      </g>
    </g>
  </g>
  <g>
    <!-- center tower (tallest): EFFECT, the dramatic opcode -->
    <rect x="280" y="30" width="80" height="270" fill="url(#building)"/>
    <g font-family="ui-monospace,monospace" font-size="7" font-weight="bold" text-anchor="middle">
      <g fill="#A855F7" filter="url(#neon)">
        <rect x="288" y="48" width="64" height="14" rx="2" opacity="0.9"/>
        <text x="320" y="59">EFFECT</text>
        <rect x="288" y="70" width="64" height="14" rx="2" opacity="0.9"/>
        <text x="320" y="81">EFFECT</text>
        <rect x="288" y="92" width="64" height="14" rx="2" opacity="0.9"/>
