<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="skycity" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="streets" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- night sky -->
  <rect width="640" height="320" fill="url(#skycity)"/>
  <!-- distant stars -->
  <g fill="#FFF" opacity="0.5">
    <circle cx="60" cy="20" r="0.7"/>
    <circle cx="180" cy="35" r="1.0"/>
    <circle cx="320" cy="15" r="0.6"/>
    <circle cx="460" cy="40" r="1.1"/>
    <circle cx="580" cy="22" r="0.8"/>
    <circle cx="100" cy="60" r="0.5"/>
    <circle cx="540" cy="80" r="0.7"/>
  </g>
  <!-- moon -->
  <circle cx="540" cy="55" r="22" fill="#E0E7FF" opacity="0.85"/>
  <circle cx="535" cy="50" r="22" fill="#0F172A"/>
  <!-- distant buildings (back row, dimmer) -->
  <g fill="#1E1B4B" opacity="0.6">
    <rect x="20" y="120" width="40" height="180"/>
    <rect x="70" y="100" width="50" height="200"/>
    <rect x="130" y="135" width="35" height="165"/>
    <rect x="175" y="110" width="45" height="190"/>
    <rect x="230" y="125" width="40" height="175"/>
    <rect x="280" y="115" width="55" height="185"/>
    <rect x="345" y="140" width="40" height="160"/>
    <rect x="395" y="105" width="50" height="195"/>
    <rect x="455" y="130" width="35" height="170"/>
    <rect x="500" y="115" width="50" height="185"/>
    <rect x="560" y="135" width="60" height="165"/>
  </g>
  <!-- foreground buildings, taller, with windows that hold the 5 opcodes -->
  <g>
    <!-- left tower: BIND, LINK -->
    <rect x="40" y="60" width="80" height="240" fill="url(#building)"/>
    <!-- windows: repeating BIND/LINK patterns -->
    <g font-family="ui-monospace,monospace" font-size="7" font-weight="bold" text-anchor="middle">
      <g fill="#3B82F6" filter="url(#neon)">
        <rect x="48" y="78" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="59" y="89">BIND</text>
        <rect x="78" y="78" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="89" y="89">LINK</text>
        <rect x="48" y="100" width="22" height="14" rx="2" opacity="0.9"/>
