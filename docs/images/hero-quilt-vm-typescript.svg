        <rect x="78" y="100" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="89" y="111">LINK</text>
        <rect x="48" y="122" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="59" y="133">BIND</text>
        <rect x="78" y="122" width="22" height="14" rx="2" opacity="0.9"/>
        <text x="89" y="133">LINK</text>
